name: server-data

# Keeps tests/data/*.lua in step with the CatsEyeXI server. Every Monday (or on demand from
# the Actions tab) it regenerates the tables from the server's current SQL and runs the
# tests against them. If the data changed, it opens a pull request (or updates the open one)
# with the new tables and the test result, so a server change that breaks a job file's ids
# or costs shows up as a failing PR instead of in game.
#
# Needs one repo setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: server-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/server-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CatsAndBoats/catseyexi
          ref: base
          path: catseyexi
          sparse-checkout: sql
      - run: sudo apt-get install -y -qq luajit

      - name: Regenerate tests/data from the server SQL
        id: regen
        run: |
          commit=$(git -C catseyexi rev-parse --short=12 HEAD)
          luajit tools/gen_resources.lua catseyexi "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # The header line carries the server commit, which moves on every server push.
          # Only a change to the rows themselves is worth a PR.
          if git diff --quiet -I '^-- Generated by' -- tests/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests against the new data
        if: steps.regen.outputs.changed == 'true'
        id: test
        run: |
          set +e
          luajit tests/run.lua > test.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat test.log

      - name: Open or update the pull request
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.regen.outputs.commit }}
          STATUS: ${{ steps.test.outputs.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add tests/data
          git commit -q -m "test: refresh server data from CatsEyeXI $COMMIT"
          git push -f origin "$BRANCH"

          if [ "$STATUS" = 0 ]; then
            title="Refresh server data from CatsEyeXI $COMMIT"
            result="All tests pass against the new server data."
          else
            title="Refresh server data from CatsEyeXI $COMMIT (tests failing)"
            result="Some tests fail against the new server data. Each FAIL below is a job file whose id or cost no longer matches the server; fix the job file on this branch before merging."
          fi
          {
            echo "The CatsEyeXI server's spell, ability or status-effect tables changed. This PR updates \`tests/data/\` to match server commit [\`$COMMIT\`](https://github.com/CatsAndBoats/catseyexi/commit/$COMMIT)."
            echo
            echo "$result"
            echo
            echo '```'
            grep -E '^(FAIL|  )|^total:' test.log | head -150
            echo '```'
            echo
            echo "Opened by the \`server-data\` workflow. It is updated in place on the next run while it stays open."
          } > body.md

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file body.md
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "$title" --body-file body.md
          fi
